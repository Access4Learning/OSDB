spring:
  data:
    redis:
      host: localhost
      port: 6379
    password: ""

server:
  port: 8085

# Service URLs
environment:
  service:
    url: http://localhost:8081

queue:
  service:
    url: http://localhost:8082

# Proxy worker configuration
proxy:
  worker:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 10

# Observability configuration
observability:
  enabled: true
  tracing:
    otlp:
      endpoint: http://localhost:4318/v1/traces
    sampling:
      probability: 1.0

logging:
  level:
    org.sifunity.requestsconnector: DEBUG
    org.springframework.web: INFO

