apiVersion: v1
kind: Service
metadata:
  name: requests-connector
  namespace: sif-broker
  labels:
    app: requests-connector
    component: connector
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: requests-connector
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
