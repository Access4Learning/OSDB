apiVersion: v1
kind: ConfigMap
metadata:
  name: requests-connector-config
  namespace: sif-broker
  labels:
    app: requests-connector
    component: connector
data:
  # Redis configuration
  redis.host: "redis-service"
  redis.port: "6379"
  
  # Service URLs
  environment.service.url: "http://environment-service:8080"
  queue.service.url: "http://queue-service:8080"
  subscription.service.url: "http://subscription-service:8080"
  responses.connector.url: "http://responses-connector:8080"
  
  # Provider timeouts (milliseconds)
  provider.timeout.connection: "5000"
  provider.timeout.read: "30000"
  
  # Proxy worker configuration
  proxy.worker.max-retries: "3"
  proxy.worker.poll-interval: "1000"
  
  # Cache configuration
  cache.ttl: "300000"
  
  # Logging configuration
  logging.level.root: "INFO"
  logging.level.org.sifunity: "INFO"
