spring:
  data:
    redis:
      host: localhost
      port: 6379
    password: ""
  
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true
      
      discovery:
        locator:
          enabled: false
      
      routes:
        # OpenAPI documentation routes
        - id: environment-service-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/environment-service
          filters:
            - RewritePath=/v3/api-docs/environment-service, /v3/api-docs
        
        - id: queue-service-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/queue-service
          filters:
            - RewritePath=/v3/api-docs/queue-service, /v3/api-docs
        
        - id: subscription-service-api-docs
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/subscription-service
          filters:
            - RewritePath=/v3/api-docs/subscription-service, /v3/api-docs
        
        - id: job-service-api-docs
          uri: http://localhost:8086
          predicates:
            - Path=/v3/api-docs/job-service
          filters:
            - RewritePath=/v3/api-docs/job-service, /v3/api-docs
        
        - id: events-connector-api-docs
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/events-connector
          filters:
            - RewritePath=/v3/api-docs/events-connector, /v3/api-docs
        
        # Block internal APIs
        - id: block-internal
          uri: no://op
          predicates:
            - Path=/internal/**
          filters:
            - SetStatus=403
        
        # Admin user management (root level - must be before generic /{domainId} routes)
        - id: admin-users
          uri: http://localhost:8081
          predicates:
            - Path=/admin-users/**,/admin-users
        
        # Admin tag definitions (root level - must be before generic /{domainId} routes)
        - id: admin-tag-definitions
          uri: http://localhost:8081
          predicates:
            - Path=/admin/tag-definitions/**,/admin/tag-definitions
        
        # Admin proxy (session-based API forwarding for admin console)
        - id: admin-proxy
          uri: http://localhost:8081
          predicates:
            - Path=/admin-proxy/**
        
        # Domain management (root level - must be before generic /{domainId} routes)
        - id: domain-service
          uri: http://localhost:8081
          predicates:
            - Path=/domains/**
        
        # Solution management (under domain - must be before generic /{domainId}/{solutionId} routes)
        - id: solution-service
          uri: http://localhost:8081
          predicates:
            - Path=/{domainId}/solutions/**
        
        # Environment Service resources (under domain/solution)
        - id: environment-service
          uri: http://localhost:8081
          predicates:
            - Path=/{domainId}/{solutionId}/environments/**,/{domainId}/{solutionId}/acl-entries/**,/{domainId}/{solutionId}/providers/**,/{domainId}/{solutionId}/zones/**,/{domainId}/{solutionId}/tags/**,/{domainId}/{solutionId}/alerts/**,/{domainId}/{solutionId}/codeSets/**,/{domainId}/{solutionId}/namespaces/**,/{domainId}/{solutionId}/solution-services/**,/{domainId}/{solutionId}/context-services/**,/{domainId}/{solutionId}/admin-users/**,/{domainId}/{solutionId}/xquerys,/{domainId}/{solutionId}/xquerys/**
        
        # Connector Service routes (pass-through to downstream services)
        - id: requests-connector
          uri: http://localhost:8085
          predicates:
            - Path=/{domainId}/{solutionId}/requests,/{domainId}/{solutionId}/requests/**
        
        - id: responses-connector
          uri: http://localhost:8088
          predicates:
            - Path=/{domainId}/{solutionId}/responses,/{domainId}/{solutionId}/responses/**
        
        - id: events-connector
          uri: http://localhost:8084
          predicates:
            - Path=/{domainId}/{solutionId}/events,/{domainId}/{solutionId}/events/**
        
        - id: services-connector
          uri: http://localhost:8087
          predicates:
            - Path=/{domainId}/{solutionId}/services,/{domainId}/{solutionId}/services/**
        
        # Core Service routes (under domain/solution)
        - id: queue-service
          uri: http://localhost:8082
          predicates:
            - Path=/{domainId}/{solutionId}/queues/**
        
        - id: subscription-service
          uri: http://localhost:8083
          predicates:
            - Path=/{domainId}/{solutionId}/subscriptions/**
        
        - id: job-service
          uri: http://localhost:8086
          predicates:
            - Path=/{domainId}/{solutionId}/jobs/**
      
      # Global timeout settings
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      
      # Default filters
      default-filters:
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2

server:
  port: 8080

# Environment Service configuration
environment-service:
  url: http://localhost:8081

# Rate limiting configuration (disabled for local dev)
sif:
  broker:
    gateway:
      rate-limit:
        enabled: false

# Observability configuration
observability:
  enabled: true
  tracing:
    otlp:
      endpoint: http://localhost:4318/v1/traces
    sampling:
      probability: 1.0

logging:
  level:
    org.sifunity.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO

