version: '3.8'

services:
  # Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - gateway-network

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Environment Service configuration
      ENVIRONMENT_SERVICE_URL: http://environment-service:8081
      
      # Spring profiles
      SPRING_PROFILES_ACTIVE: local
      
      # Logging
      LOGGING_LEVEL_ORG_SIFUNITY_GATEWAY: DEBUG
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - gateway-network
    restart: unless-stopped

  # Mock Environment Service (for local testing)
  # Uncomment this section if you want to test without a real Environment Service
  # mock-environment-service:
  #   image: wiremock/wiremock:latest
  #   container_name: mock-environment-service
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./wiremock:/home/wiremock
  #   command:
  #     - --global-response-templating
  #     - --verbose
  #   networks:
  #     - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
