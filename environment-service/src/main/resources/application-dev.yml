# Development-specific configuration
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Development bootstrap configuration
sif:
  broker:
    bootstrap:
      enabled: true
      admin:
        sessionToken: dev-admin-token
        sharedSecret: dev-admin-secret

# Development logging
logging:
  level:
    org.sifunity.broker.environment: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Secrets backend: plaintext for development only
secrets:
  backend:
    type: plaintext
