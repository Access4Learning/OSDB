---
# ConfigMap for Services Connector Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: services-connector-config
  labels:
    app: services-connector
    component: config
data:
  # Application Configuration
  SERVER_PORT: "8085"
  SPRING_APPLICATION_NAME: "services-connector"
  
  # Downstream Service URLs
  JOB_SERVICE_URL: "http://job-service:8083"
  ENVIRONMENT_SERVICE_URL: "http://environment-service:8081"
  
  # Redis Configuration
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_TIMEOUT: "2000ms"
  
  # Provider Configuration
  PROVIDER_TIMEOUT_CONNECTION: "5000"
  PROVIDER_TIMEOUT_READ: "30000"
  PROVIDER_CACHE_TTL: "300"
  
  # Job Service Timeout Configuration
  JOB_SERVICE_TIMEOUT_CONNECTION: "2000"
  JOB_SERVICE_TIMEOUT_READ: "10000"
  
  # Environment Service Timeout Configuration
  ENVIRONMENT_SERVICE_TIMEOUT_CONNECTION: "2000"
  ENVIRONMENT_SERVICE_TIMEOUT_READ: "10000"
  
  # Logging Configuration
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_ORG_SIFUNITY_SERVICESCONNECTOR: "INFO"
  
  # Actuator Configuration
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

---
# Deployment for Services Connector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: services-connector
  labels:
    app: services-connector
    component: connector
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: services-connector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: services-connector
        component: connector
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: services-connector
        image: sif-unity-broker/services-connector:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
          protocol: TCP
        - name: actuator
          containerPort: 8085
          protocol: TCP
        
        # Environment Variables from ConfigMap
        envFrom:
        - configMapRef:
            name: services-connector-config
        
        # Resource Limits and Requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Startup Probe (for slow-starting containers)
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        
        # Security Context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Pod Security Context
      securityContext:
        fsGroup: 1000
      
      # Restart Policy
      restartPolicy: Always
      
      # DNS Policy
      dnsPolicy: ClusterFirst
      
      # Termination Grace Period
      terminationGracePeriodSeconds: 30

---
# Service for Services Connector
apiVersion: v1
kind: Service
metadata:
  name: services-connector
  labels:
    app: services-connector
    component: connector
spec:
  type: ClusterIP
  selector:
    app: services-connector
  ports:
  - name: http
    port: 8085
    targetPort: 8085
    protocol: TCP
  - name: actuator
    port: 8085
    targetPort: 8085
    protocol: TCP
  sessionAffinity: None

---
# Horizontal Pod Autoscaler for Services Connector
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: services-connector-hpa
  labels:
    app: services-connector
    component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: services-connector
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# PodDisruptionBudget for Services Connector
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: services-connector-pdb
  labels:
    app: services-connector
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: services-connector
