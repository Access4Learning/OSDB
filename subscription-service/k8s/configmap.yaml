apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-service-config
  labels:
    app: subscription-service
    component: core-service
data:
  # Database Configuration
  db.host: "postgres-service"
  db.port: "5432"
  db.name: "sif_broker"
  
  # Redis Configuration
  redis.host: "redis-service"
  redis.port: "6379"
  
  # Queue Service Configuration
  queue.service.url: "http://queue-service:8082"
