apiVersion: v1
kind: Secret
metadata:
  name: subscription-service-secrets
  labels:
    app: subscription-service
    component: core-service
type: Opaque
data:
  # Note: These are base64 encoded placeholder values
  # In production, use proper secret management (e.g., Sealed Secrets, External Secrets Operator)
  # 
  # To encode values:
  # echo -n "your-value" | base64
  #
  # Example values below (DO NOT USE IN PRODUCTION):
  # db.username: postgres (base64: cG9zdGdyZXM=)
  # db.password: postgres (base64: cG9zdGdyZXM=)
  
  db.username: ""  # Replace with base64 encoded username
  db.password: ""  # Replace with base64 encoded password
