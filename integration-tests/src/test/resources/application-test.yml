# Integration Test Configuration
# This configuration is used by all microservices during integration testing

# Internal service token for test context startup
broker:
  internal-service-token: test-internal-token

spring:
  application:
    name: integration-tests
  
  # Database configuration (will be overridden by Testcontainers)
  datasource:
    url: jdbc:postgresql://localhost:5432/sif_broker_test
    username: test_user
    password: test_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  # Redis configuration (will be overridden by Testcontainers)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  
  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Logging configuration
logging:
  level:
    root: WARN
    org.sifunity: WARN
    org.springframework: WARN
    org.springframework.cloud.gateway: WARN
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    net.jqwik: WARN

# Server configuration (will be overridden with random ports)
server:
  port: 0
  shutdown: graceful

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

# SIF Broker specific configuration
sif:
  broker:
    # Bootstrap configuration - creates ADMIN environment on startup
    bootstrap:
      enabled: true
      admin:
        sessionToken: test-admin-token
        sharedSecret: dGVzdC1hZG1pbi1zZWNyZXQ=  # Base64 encoded "test-admin-secret"
    
    # Storage configuration (will be overridden with LocalStack endpoint)
    storage:
      provider: s3
      s3:
        endpoint: http://localhost:4566
        bucket: sif-broker-test-messages
        region: us-east-1
        access-key: test
        secret-key: test
    
    # Authentication configuration
    auth:
      hmac:
        timestamp-tolerance-seconds: 300
    
    # Circuit breaker configuration
    resilience:
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10
    
    # Retry configuration
    retry:
      max-attempts: 3
      wait-duration: 1000
