version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: job-service-postgres
    environment:
      POSTGRES_DB: sif_broker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-service-network

  # Job Service
  job-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sif_broker
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local

networks:
  job-service-network:
    driver: bridge
