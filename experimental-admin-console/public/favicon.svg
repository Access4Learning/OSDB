<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="rounded">
      <rect x="1" y="1" width="30" height="30" rx="6"/>
    </clipPath>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="7"/>
    </clipPath>
  </defs>
  <!-- Rounded square background: Specification blue -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="#1B3A6B"/>
  <!-- Green diagonal upper-left triangle (background) -->
  <polygon points="1,1 31,1 1,31" fill="#2EC866" clip-path="url(#rounded)"/>
  <!-- Circle with transposed colors: blue upper-left, green lower-right -->
  <circle cx="16" cy="16" r="7" fill="#2EC866"/>
  <polygon points="1,1 31,1 1,31" fill="#1B3A6B" clip-path="url(#circle)"/>
  <!-- Thin white ring to separate circle from background -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="white" stroke-width="1"/>
</svg>
