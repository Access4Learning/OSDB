# Logstash Pipeline Configuration
# Receives JSON logs from SIF Unity Broker services and sends to Elasticsearch

input {
  # TCP input for structured JSON logs
  tcp {
    port => 5000
    codec => json_lines
    type => "sif-logs"
  }

  # UDP input for structured JSON logs (optional, for high-throughput scenarios)
  udp {
    port => 5000
    codec => json_lines
    type => "sif-logs"
  }
}

filter {
  # Parse timestamp if it's a string
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add index name based on service
  mutate {
    add_field => {
      "[@metadata][index_name]" => "sif-logs-%{service}-%{+YYYY.MM.dd}"
    }
  }

  # Ensure required fields exist
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  if ![environment] {
    mutate {
      add_field => { "environment" => "unknown" }
    }
  }

  # Parse log level to lowercase for consistency
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }

  # Add tags for easier filtering
  if [level] == "error" or [level] == "fatal" {
    mutate {
      add_tag => ["error"]
    }
  }

  if [trace_id] and [trace_id] != "" {
    mutate {
      add_tag => ["traced"]
    }
  }

  if [correlation_id] and [correlation_id] != "" {
    mutate {
      add_tag => ["correlated"]
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    
    # Template for index mapping
    template_name => "sif-logs"
    template_overwrite => true
  }

  # Debug output (optional - comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}
