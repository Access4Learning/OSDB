gatling {
  core {
    # Output directory for simulation logs and reports
    directory {
      results = target/gatling
    }

    # Run description (shown in reports)
    runDescription = "SIF Unity Broker Load Test"

    # Character encoding
    encoding = "utf-8"
  }

  http {
    # Warm-up: disable to avoid hitting the gateway before the simulation starts
    enableGA = true

    # Connection pool settings
    ahc {
      connectTimeout = 10000
      requestTimeout = 60000
      pooledConnectionIdleTimeout = 60000
      maxConnectionsPerHost = 100
      maxConnections = 1000
    }
  }

  data {
    # Writers for simulation output
    writers = [console, file]

    console {
      # Light mode prints a summary at the end
      light = false
      # Write interval in seconds
      writePeriod = 5
    }

    file {
      # Generate simulation.log for HTML report generation
      bufferSize = 8192
    }
  }

  charting {
    # Charting settings for HTML reports
    indicators {
      lowerBound = 200
      higherBound = 1000
    }
  }
}
