apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-service-config
  labels:
    app: queue-service
    component: core-service
data:
  # Database Configuration
  db.host: "postgres-service"
  db.port: "5432"
  db.name: "sif_broker"
  
  # Redis Configuration
  redis.host: "redis-service"
  redis.port: "6379"
  
  # Storage Configuration
  storage.type: "s3"  # or "filesystem"
  storage.s3.bucket: "sif-broker-messages"
  storage.s3.region: "us-east-1"
  storage.filesystem.path: "/app/data/messages"
  
  # Queue Configuration
  queue.defaults.maxRetries: "3"
  queue.defaults.retryDelayMs: "5000"
  queue.defaults.visibilityTimeoutSeconds: "30"
