apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  labels:
    app: queue-service
    component: core-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: queue-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: queue-service
        component: core-service
        tier: backend
    spec:
      containers:
      - name: queue-service
        image: sif-broker/queue-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        # Database Configuration
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: db.host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: db.port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: db.name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        
        # Redis Configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: redis.port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
              optional: true
        
        # Storage Configuration
        - name: STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: storage.type
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: storage.s3.bucket
              optional: true
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: storage.s3.region
              optional: true
        - name: STORAGE_PATH
          valueFrom:
            configMapKeyRef:
              name: queue-service-config
              key: storage.filesystem.path
              optional: true
        
        # Server Configuration
        - name: SERVER_PORT
          value: "8082"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        - name: message-storage
          mountPath: /app/data/messages
      
      volumes:
      - name: message-storage
        persistentVolumeClaim:
          claimName: queue-service-storage
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
