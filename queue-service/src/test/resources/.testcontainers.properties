# Testcontainers Configuration
# Docker host is configured via DOCKER_HOST environment variable
# On Windows: npipe:////./pipe/docker_engine (set in IDE run config)
# On CI: tcp://localhost:2375 (set in pipeline env)

# Disable Ryuk container (requires --privileged which CI environments block)
testcontainers.ryuk.disabled=true

# Don't reuse containers between test runs
testcontainers.reuse.enable=false
